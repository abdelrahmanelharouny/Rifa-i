name: Python Tests

on:
  push:
    branches:
      - main
      - phase-*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run complete test suite
        run: python -m pytest -v

      - name: Verify developer experience commands
        run: |
          rifai-lsp --version
          rifai inspect examples/hello.rif --output /tmp/rifai-inspect.json
          python -c "import json; p=json.load(open('/tmp/rifai-inspect.json', encoding='utf-8')); b=p['stages']['bytecode']; assert p['success'] and b['format_version'] == 5 and b['control_flow']['<main>']['block_count'] > 0"

      - name: Validate debugger example
        run: rifai check examples/phase7_debugger.rif

      - name: Validate typed collections example
        run: |
          rifai check examples/phase8_collections.rif
          rifai run examples/phase8_collections.rif

      - name: Validate Phase 10 advanced optimization
        run: |
          rifai check examples/phase10_advanced_optimization.rif
          rifai run examples/phase10_advanced_optimization.rif > /tmp/rifai-phase10.txt
          python -c "from pathlib import Path; assert Path('/tmp/rifai-phase10.txt').read_text(encoding='utf-8').strip() == '42'"
          rifai inspect examples/phase10_advanced_optimization.rif --output /tmp/rifai-phase10.json
          python -c "import json; p=json.load(open('/tmp/rifai-phase10.json', encoding='utf-8')); s=p['stages']['bytecode']['optimization']; assert p['success'] and s['constant_loads_propagated'] > 0 and s['branches_folded'] > 0 and s['unreachable_instructions_removed'] > 0 and p['stages']['ir_pipeline']['global_cse_eliminated'] > 0"

      - name: Validate Phase 11 IR pipeline
        run: |
          rifai check examples/phase11_ir_pipeline.rif
          rifai run examples/phase11_ir_pipeline.rif > /tmp/rifai-phase11.txt
          python -c "from pathlib import Path; assert Path('/tmp/rifai-phase11.txt').read_text(encoding='utf-8').strip() == '10'"
          rifai inspect examples/phase11_ir_pipeline.rif --output /tmp/rifai-phase11.json
          python -c "import json; p=json.load(open('/tmp/rifai-phase11.json', encoding='utf-8')); s=p['stages']; assert p['success'] and s['ir']['ir_version'] == 1 and s['ir']['stats']['blocks'] > 0 and 'cfg-dominator-analysis' in s['ir_pipeline']['passes'] and s['ir_analysis']['edge_count'] > 0"

      - name: Validate Phase 12 IR-native optimization
        run: |
          rifai check examples/phase12_ir_optimization.rif
          rifai run examples/phase12_ir_optimization.rif --no-optimize > /tmp/rifai-phase12.txt
          python -c "from pathlib import Path; assert Path('/tmp/rifai-phase12.txt').read_text(encoding='utf-8').strip().splitlines() == ['42', '42']"
          rifai inspect examples/phase12_ir_optimization.rif --no-optimize --output /tmp/rifai-phase12.json
          python -c "import json; p=json.load(open('/tmp/rifai-phase12.json', encoding='utf-8')); s=p['stages']['ir_pipeline']; assert p['success'] and s['constant_folds'] == 0"
          python -c "from pathlib import Path; from rifai import Compiler; p=Path('examples/phase12_ir_optimization.rif'); r=Compiler(optimize=False, ir_optimize=True).compile(p.read_text(encoding='utf-8')); s=r.ir_stats; assert r.is_success and s.constant_folds >= 2 and s.branches_simplified == 1 and s.blocks_removed >= 1"

      - name: Validate Phase 13 direct AST-to-IR compilation
        run: |
          rifai check examples/phase13_direct_ast_to_ir.rif
          rifai run examples/phase13_direct_ast_to_ir.rif > /tmp/rifai-phase13.txt
          python -c "from pathlib import Path; assert Path('/tmp/rifai-phase13.txt').read_text(encoding='utf-8').strip().splitlines() == ['12', '65']"
          rifai inspect examples/phase13_direct_ast_to_ir.rif --output /tmp/rifai-phase13.json
          python -c "import json; p=json.load(open('/tmp/rifai-phase13.json', encoding='utf-8')); s=p['stages']; assert p['success'] and s['ir']['origin'] == 'direct-ast' and s['ir']['stats']['functions'] == 1 and s['ir']['stats']['blocks'] > 0 and s['bytecode']['format_version'] == 5"
          python -c "from pathlib import Path; from rifai import Compiler; p=Path('examples/phase13_direct_ast_to_ir.rif'); r=Compiler(optimize=False).compile(p.read_text(encoding='utf-8')); assert r.is_success and r.ir_origin == 'direct-ast' and r.module.debug_info.source_text == p.read_text(encoding='utf-8')"

      - name: Validate Phase 14 advanced IR optimization
        run: |
          rifai check examples/phase14_advanced_ir_optimization.rif
          rifai run examples/phase14_advanced_ir_optimization.rif --no-optimize > /tmp/rifai-phase14.txt
          python -c "from pathlib import Path; assert Path('/tmp/rifai-phase14.txt').read_text(encoding='utf-8').strip().splitlines() == ['30', '30', '3']"
          rifai inspect examples/phase14_advanced_ir_optimization.rif --no-optimize --output /tmp/rifai-phase14.json
          python -c "import json; p=json.load(open('/tmp/rifai-phase14.json', encoding='utf-8')); assert p['success'] and p['stages']['ir']['origin'] == 'direct-ast' and p['stages']['ir_pipeline']['passes'][-1] == 'side-effect-analysis'"
          python -c "from pathlib import Path; from rifai import Compiler; p=Path('examples/phase14_advanced_ir_optimization.rif'); r=Compiler(optimize=False, ir_optimize=True).compile(p.read_text(encoding='utf-8')); s=r.ir_stats; assert r.is_success and s.global_cse_eliminated > 0 and s.loop_invariants_hoisted > 0"

      - name: Validate Phase 15 language evolution
        run: |
          rifai check examples/phase15_language_evolution.rif
          rifai run examples/phase15_language_evolution.rif > /tmp/rifai-phase15.txt
          python -c "from pathlib import Path; assert Path('/tmp/rifai-phase15.txt').read_text(encoding='utf-8').strip().splitlines() == ['Mona', '29', 'true', '150.0', '12', '9.0', 'true', 'Comp']"
          rifai inspect examples/phase15_language_evolution.rif --output /tmp/rifai-phase15.json
          python -c "import json; p=json.load(open('/tmp/rifai-phase15.json', encoding='utf-8')); assert p['success'] and p['stages']['bytecode']['format_version'] == 5 and p['stages']['ir']['origin'] == 'direct-ast'"

      - name: Verify interactive debugger smoke test
        run: |
          printf '%s\n' continue continue | rifai debug examples/phase7_debugger.rif --breakpoint 4 > /tmp/rifai-debug.txt
          python -c "from pathlib import Path; text=Path('/tmp/rifai-debug.txt').read_text(encoding='utf-8'); assert 'Paused (entry)' in text and 'Paused (breakpoint)' in text and 'Execution finished:' in text"


      - name: Validate VS Code extension manifests
        run: |
          python -c "import json; from pathlib import Path; files=['editors/vscode/package.json','editors/vscode/language-configuration.json','editors/vscode/syntaxes/rifai.tmLanguage.json','editors/vscode/snippets/rifai.json']; data=[json.loads(Path(p).read_text(encoding='utf-8')) for p in files]; assert any(item['type']=='rifai' for item in data[0]['contributes']['debuggers'])"

      - name: Verify benchmark CLI smoke test
        run: python benchmarks/benchmark_pipeline.py --iterations 100 --repeat 1
